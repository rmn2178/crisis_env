name: crisis_response_env
version: "1.0.0"
description: "AI Crisis Response and Rescue Coordination Environment"

observation_space:
  type: object
  properties:
    threat_id: {type: string}
    threat_type: {type: string, enum: [AIRSTRIKE, SHIP_ATTACK, DRONE_THREAT]}
    location: {type: string}
    severity: {type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW]}
    population_at_risk: {type: integer}
    time_to_impact: {type: integer}
    available_resources: {type: array, items: {type: string}}
    threats_remaining: {type: integer}
    last_action_result: {type: string}
    cumulative_score: {type: number}
    done: {type: boolean}

action_space:
  type: object
  required: [action_type, threat_id]
  properties:
    action_type: {type: string, enum: [classify, predict, allocate, rescue]}
    threat_id: {type: string}
    resource_id: {type: string, nullable: true}
    priority_level: {type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW], nullable: true}
    reasoning: {type: string, nullable: true}

tasks:
  - id: easy
    name: "Single-Threat Classification"
    difficulty: easy
    description: "5 clear threats, one at a time. No resource conflicts. Expected score: ~0.80"
  - id: medium
    name: "Multi-Threat Coordination"
    difficulty: medium
    description: "10 mixed threats, hidden cascade. Prioritization required. Expected score: ~0.55"
  - id: hard
    name: "Full Lifecycle Rescue Optimization"
    difficulty: hard
    description: "15 threats, resource scarcity, rescue phase. CRITICAL miss penalty. Expected score: ~0.30"

endpoints:
  reset:  "POST /reset"
  step:   "POST /step"
  state:  "GET /state"
  health: "GET /health"

reward:
  type: dense
  range: [0.0, 1.0]
  description: >
    Per-step dense rewards. Correct priority: +0.50. Correct resource: +0.30.
    Rescue speed bonus: +0.20. Wrong threat_id: -0.10. Invalid action: -0.20.
    Missed CRITICAL: -0.20. All rewards clipped to [0.0, 1.0] per step.

environment:
  episode_length:
    easy: 5
    medium: 10
    hard: 15
  reset_clears_state: true
  observations_are_deterministic: true
